<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
	:root {
		color-scheme: light;
		--bg: #f1f6fd;
		--panel: #ffffff;
		--text: #0f1b2d;
		--muted: #64748b;
		--primary: #1d6fe8;
		--primary-dark: #1558bd;
		--tint: #eaf2ff;
		--bubble: #f1f5fb;
		--line: #e3eaf5;
		--font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0; background: var(--bg); color: var(--text);
		font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased;
	}
	main {
		max-width: 760px; height: 100dvh; margin: 0 auto;
		display: flex; flex-direction: column; background: var(--panel);
	}
	@media (min-width: 800px) {
		main {
			height: calc(100dvh - 3rem); margin: 1.5rem auto; border-radius: 16px;
			border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(29, 111, 232, .08);
			overflow: hidden;
		}
	}

	header {
		padding: .85rem 1.1rem .7rem; border-bottom: 1px solid var(--line);
		display: flex; flex-wrap: wrap; align-items: center; gap: .6rem .75rem;
	}
	.brand { display: flex; align-items: center; gap: .55rem; margin-right: auto; }
	.brand svg { width: 32px; height: 32px; flex: none; }
	.brand span { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }

	form { display: flex; gap: .5rem; }
	input {
		min-width: 0; padding: .55rem .75rem; border: 1px solid var(--line);
		border-radius: 10px; background: #fff; color: inherit; font: inherit;
		transition: border-color .15s, box-shadow .15s;
	}
	input::placeholder { color: #94a3b8; }
	input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29, 111, 232, .15); }
	#join input { width: 8.5rem; }

	button {
		display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
		padding: .55rem 1rem; border: 0; border-radius: 10px; cursor: pointer;
		background: var(--primary); color: #fff; font: 600 .95rem var(--font);
		transition: background .15s;
	}
	button:hover:not(:disabled) { background: var(--primary-dark); }
	button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
	button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
	button svg { width: 18px; height: 18px; }

	#status {
		width: 100%; display: flex; align-items: center; gap: .45rem;
		font-size: .8rem; color: var(--muted);
	}
	#status::before {
		content: ""; width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; flex: none;
	}
	#status[data-state="on"]::before { background: var(--primary); }
	#status[data-state="wait"]::before { background: #f59e0b; }

	#log {
		flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 1.1rem;
		display: flex; flex-direction: column; gap: .45rem; background: #fbfdff;
	}
	#log li {
		max-width: 78%; padding: .5rem .8rem; background: var(--bubble); align-self: flex-start;
		border-radius: 14px 14px 14px 4px; overflow-wrap: anywhere;
	}
	#log li.me {
		background: var(--primary); color: #fff; align-self: flex-end;
		border-radius: 14px 14px 4px 14px;
	}
	#log li.empty {
		align-self: center; margin: auto; background: none; color: var(--muted);
		text-align: center; max-width: 24rem;
	}
	#log b { display: block; font-size: .75rem; font-weight: 600; color: var(--primary-dark); margin-bottom: .1rem; }

	#send { padding: .8rem 1rem; border-top: 1px solid var(--line); }
	#send input { flex: 1; }
	#send button { padding: .55rem .8rem; }
</style>
</head>
<body>
<main>
	<header>
		<div class="brand">
			<svg viewBox="0 0 32 32" aria-hidden="true">
				<circle cx="16" cy="16" r="16" fill="#1d6fe8"/>
				<path d="M8 17 3 13l1 7z" fill="#fff"/>
				<ellipse cx="15" cy="18" rx="8" ry="6" fill="#fff"/>
				<circle cx="21" cy="13" r="4.5" fill="#fff"/>
				<path d="M25 12l5 1.5L25 15z" fill="#bfdbfe"/>
				<path d="M11 18c2-3 6-3 8 0-2 3-6 3-8 0z" fill="#bfdbfe"/>
				<circle cx="22.5" cy="12.2" r="1" fill="#1d6fe8"/>
			</svg>
			<span>Pipit</span>
		</div>

		<form id="join">
			<input id="user" placeholder="Tu nombre" maxlength="30" required aria-label="Tu nombre">
			<input id="topic" placeholder="Tópico" value="general" maxlength="40" required aria-label="Tópico">
			<button>Entrar</button>
		</form>

		<span id="status" data-state="off" aria-live="polite">Elige un nombre y un tópico para empezar.</span>
	</header>

	<ul id="log"></ul>

	<form id="send">
		<input id="text" placeholder="Escribe un mensaje" autocomplete="off" disabled aria-label="Mensaje">
		<button disabled aria-label="Enviar">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<line x1="22" y1="2" x2="11" y2="13"/>
				<polygon points="22 2 15 22 11 13 2 9 22 2"/>
			</svg>
		</button>
	</form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const api = (topic) => `/api/topics/${encodeURIComponent(topic)}`;

let es = null;       // conexión SSE actual
let me = '';         // mi nombre (sender_id)
let topic = '';      // tópico actual
let messages = [];   // mensajes mostrados, ordenados por id
const seen = new Set();

render();

$('join').addEventListener('submit', (e) => {
	e.preventDefault();
	me = $('user').value.trim();
	topic = $('topic').value.trim();
	if (me && topic) connect();
});

$('send').addEventListener('submit', async (e) => {
	e.preventDefault();
	const body = $('text').value.trim();
	if (!body) return;

	$('text').value = '';
	try {
		const res = await fetch(`${api(topic)}/messages`, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ sender_id: me, body }),
		});
		if (!res.ok) throw new Error(res.status);
		// El mensaje aparece cuando llega por el stream (puede tardar hasta ~1 s).
	} catch {
		$('text').value = body; // lo devolvemos para que pueda reintentar
		setStatus('No se pudo enviar el mensaje.');
	}
});

function connect() {
	if (es) es.close();
	messages = [];
	seen.clear();

	const t = topic;
	let first = true;

	setStatus('Conectando…', 'wait');
	render();

	// Se abre primero el stream y después se pide el historial: así no se
	// pierde ningún mensaje entre ambos (los duplicados se descartan por id).
	es = new EventSource(`${api(t)}/stream`);

	es.onopen = () => {
		setStatus(`Conectado a #${t} como ${me}`, 'on');
		if (first) { first = false; loadHistory(t); }
	};
	es.onerror = () => setStatus('Reconectando…', 'wait'); // EventSource reintenta solo
	es.addEventListener('message', (e) => add(JSON.parse(e.data)));

	$('text').disabled = false;
	$('send').querySelector('button').disabled = false;
	$('text').focus();
}

async function loadHistory(t) {
	try {
		const res = await fetch(`${api(t)}/messages?limit=50`);
		if (!res.ok) throw new Error(res.status);
		const list = await res.json();
		if (t === topic) add(...list); // ignora la respuesta si ya cambió de tópico
	} catch {
		setStatus('No se pudo cargar el historial.');
	}
}

function add(...list) {
	for (const m of list) {
		if (seen.has(m.id)) continue;
		seen.add(m.id);
		messages.push(m);
	}
	messages.sort((a, b) => a.id - b.id);
	render();
}

function render() {
	const log = $('log');
	const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;

	if (messages.length === 0) {
		const li = document.createElement('li');
		li.className = 'empty';
		li.textContent = es
			? 'Todavía no hay mensajes. Escribe el primero.'
			: 'Entra a un tópico para ver la conversación.';
		log.replaceChildren(li);
		return;
	}

	log.replaceChildren(...messages.map((m) => {
		const li = document.createElement('li');
		const mine = m.sender_id === me;
		if (mine) li.className = 'me';

		if (!mine) {
			const who = document.createElement('b');
			who.textContent = m.sender_id;
			li.append(who);
		}
		li.append(document.createTextNode(m.body));
		return li;
	}));

	if (atBottom) log.scrollTop = log.scrollHeight;
}

function setStatus(text, state) {
	const el = $('status');
	el.textContent = text;
	if (state) el.dataset.state = state;
}
</script>
</body>
</html>
